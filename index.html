<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="YOUR_FAVICON_URL" type="image/png">
<title>Penny App</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url("YOUR_BACKGROUND_IMAGE_URL") center/cover no-repeat fixed;
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* Metallic copper sheen */
    .metallic {
        background: linear-gradient(145deg, #b87333, #8a4b20, #c47a3c);
        background-size: 400% 400%;
        animation: sheen 6s ease infinite;
    }

    @keyframes sheen {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* Center container */
    .table-container {
        width: 75%;
        max-height: 80vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        color: white;
        font-size: 20px;
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        text-align: center;
    }

    th {
        font-size: 22px;
        position: sticky;
        top: 0;
        background: rgba(60, 30, 10, 0.95);
    }

    /* Glow text */
    .glow {
        color: white;
        text-shadow:
            0 0 6px white,
            0 0 12px white,
            1px 1px 0 black,
            -1px -1px 0 black;
    }

    /* Hover animation */
    tr:hover td {
        background: rgba(255,255,255,0.15);
        transition: 0.2s;
    }

    /* Search bar */
    #searchBox {
        width: 60%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: none;
        font-size: 18px;
        outline: none;
        text-align: center;
        box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    /* Coin flip loader */
    #loader {
        position: absolute;
        width: 150px;
        height: 150px;
        animation: flip 1s infinite;
    }

    @keyframes flip {
        0% { transform: rotateY(0deg); }
        50% { transform: rotateY(180deg); }
        100% { transform: rotateY(360deg); }
    }

    /* Hide table until loaded */
    #appContent {
        display: none;
    }

    /* Entry form */
    #entryForm {
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 15px;
        background: rgba(0,0,0,0.3);
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    #entryForm input, #entryForm select {
        padding: 10px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    #entryForm button {
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        background: #b87333;
        color: white;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

</style>
</head>
<body>

<!-- Coin flip loader -->
<img id="loader" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/2010_cent_obverse.png/600px-2010_cent_obverse.png">

<div id="appContent">

    <!-- Search bar -->
    <center><input id="searchBox" class="glow" placeholder="Search coins..."></center>

    <!-- New entry form -->
    <center>
    <form id="entryForm">
        <input type="number" id="year" placeholder="Year">
        <select id="mint">
            <option value="">Mintmark</option>
            <option>D</option>
            <option>S</option>
        </select>
        <select id="posneg">
            <option value="">Pos/Neg</option>
            <option>Positive</option>
            <option>Negative</option>
        </select>
        <select id="denom">
            <option value="">Denomination</option>
            <option>Penny</option>
            <option>Dime</option>
            <option>Nickel</option>
            <option>Quarter</option>
            <option>Half Dollar</option>
            <option>Two Cent</option>
            <option>World</option>
        </select>
        <input type="number" id="weight" placeholder="Weight (gr)">
        <button type="button" onclick="submitEntry()">Add</button>
    </form>
    </center>

    <div class="table-container metallic">
        <table id="coinTable">
            <thead>
                <tr class="glow">
                    <th>Year</th>
                    <th>Mintmark</th>
                    <th>Positive/Negative</th>
                    <th>Denomination</th>
                    <th>Weight (gr)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
const sheetURL = "YOUR_CSV_URL_HERE";

/* Force 1.0–1.25 sec loading delay */
const delay = 1000 + Math.random() * 250;

setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("appContent").style.display = "block";
    loadSheet();
}, delay);

/* Load CSV */
async function loadSheet() {
    const response = await fetch(sheetURL);
    const text = await response.text();

    const rows = text.split("\n").slice(1);
    const tbody = document.querySelector("#coinTable tbody");

    rows.forEach(row => {
        const cols = row.split(",");
        if (cols.length < 5) return;

        const tr = document.createElement("tr");
        cols.forEach(col => {
            const td = document.createElement("td");
            td.classList.add("glow");
            td.textContent = col.trim();
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

/* Search filter */
document.getElementById("searchBox").addEventListener("input", function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll("#coinTable tbody tr");

    rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(filter)
            ? ""
            : "none";
    });
});

/* Submit new entry (requires Apps Script endpoint) */
function submitEntry() {
    alert("Entry submission requires your Google Apps Script endpoint. Say 'make the entry script' and I’ll generate it.");
}
</script>

</body>
</html>
