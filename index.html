<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="https://en.wikipedia.org/wiki/Penny#/media/File:US_One_Cent_Obv.png" type="image/png">
<title>Penny App</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url("https://i.etsystatic.com/28167078/r/il/37e64e/6117989325/il_1588xN.6117989325_dbew.jpg") center/cover no-repeat fixed;
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .metallic {
        background: linear-gradient(145deg, #b87333, #8a4b20, #c47a3c);
        background-size: 400% 400%;
        animation: sheen 6s ease infinite;
    }

    @keyframes sheen {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .table-container {
        width: 75%;
        max-height: 80vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 0 25px rgba(0,0,0,0.6);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        color: white;
        font-size: 20px;
    }

    th, td {
        padding: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        text-align: center;
    }

    th {
        font-size: 22px;
        position: sticky;
        top: 0;
        background: rgba(60, 30, 10, 0.95);
    }

    .glow {
        color: white;
        text-shadow:
            0 0 6px white,
            0 0 12px white,
            1px 1px 0 black,
            -1px -1px 0 black;
    }

    tr:hover td {
        background: rgba(255,255,255,0.15);
        transition: 0.2s;
    }

    #searchBox {
        width: 60%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: none;
        font-size: 18px;
        outline: none;
        text-align: center;
        box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }

    #loader {
        position: absolute;
        width: 150px;
        height: 150px;
        animation: flip 1s infinite;
    }

    @keyframes flip {
        0% { transform: rotateY(0deg); }
        50% { transform: rotateY(180deg); }
        100% { transform: rotateY(360deg); }
    }

    #appContent {
        display: none;
    }

    #entryForm {
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 15px;
        background: rgba(0,0,0,0.3);
        box-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    #entryForm input, #entryForm select {
        padding: 10px;
        margin: 5px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
    }

    #entryForm button {
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
        background: #b87333;
        color: white;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
</style>
</head>
<body>

<img id="loader" src="https://en.wikipedia.org/wiki/Penny#/media/File:US_One_Cent_Obv.png">

<div id="appContent">

    <center><input id="searchBox" class="glow" placeholder="Search coins..."></center>

    <center>
    <form id="entryForm">
        <input type="number" id="year" placeholder="Year">
        <select id="mint">
            <option value="">Mintmark</option>
            <option>D</option>
            <option>S</option>
        </select>
        <select id="posneg">
            <option value="">Pos/Neg</option>
            <option>Positive</option>
            <option>Negative</option>
        </select>
        <select id="denom">
            <option value="">Denomination</option>
            <option>Penny</option>
            <option>Dime</option>
            <option>Nickel</option>
            <option>Quarter</option>
            <option>Half Dollar</option>
            <option>Two Cent</option>
            <option>World</option>
        </select>
        <input type="number" id="weight" placeholder="Weight (gr)">
        <button type="button" onclick="submitEntry()">Add</button>
    </form>
    </center>

    <div class="table-container metallic">
        <table id="coinTable">
            <thead>
                <tr class="glow">
                    <th>Year</th>
                    <th>Mintmark</th>
                    <th>Positive/Negative</th>
                    <th>Denomination</th>
                    <th>Weight (gr)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQB4rA7szP3a7HIvIYWMIjaFop3twAGxi25FFoQwgk0MrvnyiA2Sj637-T8LlYXAFFxe8pD29K0O1QN/pub?output=csv";

const delay = 1000 + Math.random() * 250;

setTimeout(() => {
    document.getElementById("loader").style.display = "none";
    document.getElementById("appContent").style.display = "block";
    loadSheet();
}, delay);

async function loadSheet() {
    const response = await fetch(sheetURL);
    const text = await response.text();

    const rows = text.split("\n").slice(1);
    const tbody = document.querySelector("#coinTable tbody");

    rows.forEach(row => {
        const cols = row.split(",");
        if (cols.length < 5) return;

        const tr = document.createElement("tr");
        cols.forEach(col => {
            const td = document.createElement("td");
            td.classList.add("glow");
            td.textContent = col.trim();
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
}

document.getElementById("searchBox").addEventListener("input", function() {
    const filter = this.value.toLowerCase();
    const rows = document.querySelectorAll("#coinTable tbody tr");

    rows.forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(filter)
            ? ""
            : "none";
    });
});

function submitEntry() {
    const payload = {
        year: document.getElementById("year").value,
        mint: document.getElementById("mint").value,
        posneg: document.getElementById("posneg").value,
        denom: document.getElementById("denom").value,
        weight: document.getElementById("weight").value
    };

    fetch("https://script.google.com/macros/s/AKfycbwp3GNIehSFzeI7SNxjUax0hnk4z4jCKl6RzLGf7NXDrEnk9fWN9_NkOquD5QpKpYD-/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    });

    alert("Entry submitted.");
}
</script>

</body>
</html>
